name: Build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    if: |
      !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release '))
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Curato.Web/package-lock.json

      - name: Restore
        run: dotnet restore Curato.slnx

      - name: Build
        run: dotnet build Curato.slnx --no-restore -c Release -p:Platform="Any CPU"

      # Failed tests also become annotations (one per test, first 10), which show on the
      # run's page and in the public checks API without digging through the log.
      - name: Test
        run: |
          set -o pipefail
          dotnet test Curato.slnx --no-build -c Release -p:Platform="Any CPU" 2>&1 | tee test.log && exit 0
          awk '/^[[:space:]]+Failed [A-Za-z]/ { if (msg) print msg; n++; msg = "::error title=" $2 "::"; lines = 0; next }
               msg && lines < 6 { gsub(/^[[:space:]]+/, ""); msg = msg $0 " | "; lines++ }
               END { if (msg) print msg }' test.log | head -10
          exit 1

      - name: Install web dependencies
        working-directory: Curato.Web
        run: npm ci

      - name: Build web frontend
        working-directory: Curato.Web
        run: npm run build

  image:
    name: Build & publish Docker image
    needs: build
    # Every push to main publishes :latest (the NAS's update.sh pulls it); a v* tag also
    # publishes that version and creates the GitHub Release. Pull requests only build.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Also lowercases the image name (the repo is "Curato"; GHCR needs "curato").
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/curato
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      # amd64 only: the target NAS (DS1821+) is x86. Add linux/arm64 (plus
      # docker/setup-qemu-action) when an ARM NAS needs it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
