# Curato on a Synology NAS (Container Manager -> Project -> Create, paste this file).
#
# 1. Create the folder /volume1/docker/curato on the NAS (File Station). Leave it empty:
#    it holds Curato's own settings (admin account, iCloud login).
# 2. Set `user:` below to the DSM user that owns your photos (see the comment there).
#    That user needs Read/Write on /volume1/docker/curato and the photo folder, granted to
#    the user itself, not only via a group like administrators (the container gets only
#    the group in `user:`): File Station -> right-click the folder -> Properties ->
#    Permission -> Create -> your user, Read + Write, this folder, sub-folders and files.
# 3. Under `volumes:`, map each photo folder you want Curato to manage.
# 4. Start this project; the web UI is at http://<nas-ip>:8081. Create the admin account;
#    the library opens by itself (it's whatever you mapped to /photos below).
services:
  curato:
    image: ghcr.io/bleze/curato:latest
    container_name: curato
    restart: unless-stopped
    # Curato never runs as root. Files it creates or moves in your photo folders
    # belong to this user, exactly as if you had copied them over SMB.
    # Find your numbers over SSH with `id <your-dsm-user>`:
    #   uid=1026(you) gid=100(users)  ->  "1026:100"
    user: "1026:100"
    ports:
      # NAS port : container port. If 8081 is taken on the NAS, change only the first number.
      - "8081:8080"
    volumes:
      - /volume1/docker/curato:/data
      # YOUR PHOTOS - edit this line. Left side: the photo folder on the NAS; it must
      # already exist, or the project fails with "bind mount failed". Find it in
      # File Station -> right-click the shared folder -> Properties -> Location.
      # Keep the right side as /photos: that's where Curato looks for the library.
      - /volume1/photo:/photos
    environment:
      - TZ=Europe/Copenhagen
    stop_grace_period: 60s  # lets a running scan or iCloud sync stop cleanly
